name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches bl_info version
        run: |
          VERSION=$(python3 - <<'EOF'
          import ast
          src = open("gamerig/__init__.py", encoding="utf-8").read()
          for node in ast.parse(src).body:
              if isinstance(node, ast.Assign) and any(getattr(t, "id", None) == "bl_info" for t in node.targets):
                  info = ast.literal_eval(node.value)
                  print(".".join(str(v) for v in info["version"]))
                  break
          EOF
          )
          echo "bl_info version: $VERSION / tag: $GITHUB_REF_NAME"
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match bl_info version $VERSION"
            exit 1
          fi

      - name: Build zip
        run: sh package.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" gamerig.zip \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
